<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>配置服务部署参数 - Deployment Control Plane</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <h1>Deployment Control Plane</h1>
    </div>
    <div class="topbar__meta">
      <a class="btn btn--ghost" href="index.html">← 返回服务列表</a>
    </div>
  </header>

  <main class="content">
    <div class="form-card">
      <div class="form-card__head">
        <h2 id="svc-edit-title">配置服务</h2>
        <a class="btn btn--ghost" href="index.html">取消编辑</a>
      </div>
      <div class="form-grid">
        <label>serviceId（来自 service_registry）
          <input type="text" id="svc-serviceId" readonly />
        </label>
        <label>name（本机显示名）
          <input type="text" id="svc-name" placeholder="可留空，默认等于 serviceId" />
        </label>
        <label>runtimeDir
          <input type="text" id="svc-runtimeDir" placeholder="/Users/gaolei/runtime/web-cursor" />
        </label>
        <label>healthUrl
          <input type="text" id="svc-healthUrl" placeholder="http://127.0.0.1:4211/health" />
        </label>
        <label>服务端口 PORT（必填，注入 SERVICE_PORT）
          <input type="number" id="svc-port" min="1" max="65535" step="1" required placeholder="例如 4211" />
        </label>
        <label>startCmd
          <input type="text" id="svc-startCmd" placeholder="bash scripts/start.sh" />
        </label>
        <label>stopCmd
          <input type="text" id="svc-stopCmd" placeholder="bash scripts/stop.sh" />
        </label>
        <label>restartCmd
          <input type="text" id="svc-restartCmd" placeholder="bash scripts/restart.sh" />
        </label>
        <label>gitRepoUrl（来自 service_registry，不可改）
          <input type="text" id="svc-gitRepoUrl" placeholder="注册中心登记后自动同步" readonly />
        </label>
        <label>defaultBranch
          <input type="text" id="svc-defaultBranch" placeholder="main" />
        </label>
        <label>restartNotifyUrl
          <input type="text" id="svc-restartNotifyUrl" placeholder="可选，graceful 通知" />
        </label>
        <label>restartPollUrl
          <input type="text" id="svc-restartPollUrl" placeholder="可选，graceful 轮询" />
        </label>
        <label>gracefulRestartMaxWaitMs
          <input type="number" id="svc-gracefulRestartMaxWaitMs" min="0" step="1" placeholder="0 = 服务端默认" />
        </label>
        <div class="form-actions">
          <button class="btn btn--primary" id="svc-save">保存部署配置</button>
          <a class="btn" href="index.html">返回服务列表</a>
          <span id="svc-msg" class="muted"></span>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="service-edit.js"></script>
</body>
</html>
